name: Android CI

on:
  push:
    branches: [ main, ai-experimental ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and optimized release APK
        run: >-
          ./gradlew --no-configuration-cache -PskipScreenshots
          :core:test :app:testDebugUnitTest :app:lintRelease
          :app:assembleRelease :app:compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
            core/build/reports
            core/build/test-results
            app/build/outputs/mapping/release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
