name: Android CI

on:
  push:
    # Every branch gets a signed release APK; tags are left out on purpose.
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: >-
          ./gradlew --no-configuration-cache -PskipScreenshots
          :core:test :app:testDebugUnitTest :app:lintRelease
          :app:compileDebugAndroidTestKotlin
      - name: Assemble unsigned pull request APK
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-configuration-cache :app:assembleRelease
      - name: Assemble signed release APK
        if: github.event_name == 'push'
        env:
          ION_RELEASE_KEYSTORE_BASE64: ${{ secrets.ION_RELEASE_KEYSTORE_BASE64 }}
          ION_RELEASE_STORE_PASSWORD: ${{ secrets.ION_RELEASE_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ION_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${ION_RELEASE_STORE_PASSWORD:?Missing release password secret}"
          umask 077
          keystore="$(mktemp "${RUNNER_TEMP}/ion-release.XXXXXX")"
          trap 'rm -f -- "$keystore" keystore.properties' EXIT
          printf '%s' "$ION_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\n' "$keystore" "$ION_RELEASE_STORE_PASSWORD" > keystore.properties
          unset ION_RELEASE_KEYSTORE_BASE64 ION_RELEASE_STORE_PASSWORD
          ./gradlew --no-configuration-cache :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
            core/build/reports
            core/build/test-results
            app/build/outputs/mapping/release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
