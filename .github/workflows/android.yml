name: Android CI

on:
  push:
    # Every branch gets a signed release APK; tags are left out on purpose.
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Pushes to main publish a prerelease for the in-app updater.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count, release notes list commits since the last build.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android framework jars from Maven Central during the tests; a failed download
      # once failed every Robolectric test. Cached, the tests no longer depend on that network call.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-
      - name: Unit tests and lint
        run: >-
          ./gradlew --no-configuration-cache -PskipScreenshots
          :core:test :app:testDebugUnitTest :app:lintRelease
          :app:compileDebugAndroidTestKotlin
      - name: Assemble unsigned pull request APK
        if: github.event_name == 'pull_request'
        run: ./gradlew --no-configuration-cache :app:assembleRelease
      - name: Assemble signed release APK
        id: apk
        if: github.event_name == 'push'
        uses: ./.github/actions/signed-apk
        with:
          keystore-base64: ${{ secrets.ION_RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ION_RELEASE_STORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
            core/build/reports
            core/build/test-results
            app/build/outputs/mapping/release
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: app-release
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.apk.outputs.build }}
          VERSION: ${{ steps.apk.outputs.version-name }}
          APK: ${{ steps.apk.outputs.apk }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${BUILD}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already published"; exit 0; fi
          # Notes: commits since the previous published build (or the last 20 for the very first one).
          previous="$(git tag --list 'build-*' --sort=-v:refname | head -n1)"
          range="${previous:+${previous}..}HEAD"
          { echo "Предварительная сборка ${BUILD} (${VERSION})."; echo
            git log --no-merges --format='- %s' -n 20 "$range"; } > notes.md
          gh release create "$tag" "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "Ion ${VERSION} · сборка ${BUILD}" --notes-file notes.md
      - name: Keep the 15 newest prereleases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
